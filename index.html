<!doctype html>
<html lang="ja" class="preplay">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="description" content="サイコロをフリックで回し、迫るサイコロと目をそろえるアクションパズル。スマホでもPCでもブラウザで遊べます。">
<meta property="og:type" content="website">
<meta property="og:title" content="Korokoro">
<meta property="og:description" content="フリックでサイコロを回して、迫るサイコロと目をそろえよう。">
<title>Korokoro | サイコロアクションパズル</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; overscroll-behavior: none; }
  :root { --board-height: 100vh; --field-size: min(100vw, var(--board-height)); }
  @supports (height: 100dvh) { :root { --board-height: 100dvh; } }
  html.inverted { filter: invert(1); }
  body { background: #262626; touch-action: none; user-select: none; -webkit-user-select: none; }
  .inverted body { background: #d9d9d9; }
  canvas, main, .incoming {
    position: fixed;
    left: calc((100vw - var(--field-size)) / 2);
    top: calc((var(--board-height) - var(--field-size)) / 2);
    width: var(--field-size); height: var(--field-size);
  }
  main, .incoming { overflow: clip; }
  canvas { background: #000; pointer-events: none; }
  .start-logo {
    position: fixed; left: 50%; top: calc(var(--board-height) / 2 - 10vmin - 28px);
    width: min(72vw, 520px); height: auto; max-height: 23vh;
    object-fit: contain; transform: translate(-50%, -100%); pointer-events: none;
  }
  .start-credit {
    position: fixed; top: calc(var(--board-height) / 2 + 10vmin + 36px); left: 50%;
    transform: translateX(-50%); margin: 0; pointer-events: none;
    color: #aaa; font: 16px / 1.5 "Orbitron", system-ui, sans-serif; text-align: center;
  }
  @media (max-height: 420px) {
    .start-credit { font-size: 0.75rem; }
  }
  main { --perspective: 900px; display: grid; place-items: center; perspective: var(--perspective); cursor: grab; }
  main:active { cursor: grabbing; }
  .die {
    --size: clamp(76px, 26vmin, 180px);
    --half: calc(var(--size) / 2);
    position: relative;
    width: var(--size);
    height: var(--size);
    transform-style: preserve-3d;
    pointer-events: none;
  }
  .face {
    position: absolute;
    inset: 0;
    transform: var(--side) translateZ(var(--half));
    backface-visibility: hidden;
    display: grid;
    grid-template: repeat(3, 1fr) / repeat(3, 1fr);
    place-items: center;
    padding: 15%;
    border-radius: 6%;
    background: radial-gradient(circle at 32% 24%, #fff 40%, #e3e3e3);
    box-shadow: inset 0 0 0 1px #fff, inset 0 0 10px #0002;
  }
  .pip { width: 68%; aspect-ratio: 1; background: #141414; border-radius: 50%; }
  .one .pip { width: 100%; background: #c61625; }
  .incoming { pointer-events: none; }
  .piece { position: absolute; top: 50%; left: 50%; }
  .piece::before {
    content: none; position: absolute; top: 50%; left: 50%;
    width: var(--arrival-length, 0px); height: 92%;
    background:
      linear-gradient(90deg, #fff, #79edff 55%, transparent) left 8% / 84% 3px no-repeat,
      linear-gradient(90deg, #ffecff, #ff55ae 55%, transparent) left 27% / 65% 4px no-repeat,
      linear-gradient(90deg, #fff 24%, #8ef6ff 65%, transparent) left 51% / 100% 9px no-repeat,
      linear-gradient(90deg, #fff, #a28aff 60%, transparent) left 73% / 78% 4px no-repeat,
      linear-gradient(90deg, #ffebff, #ff68bb 60%, transparent) left 93% / 56% 3px no-repeat;
    filter: drop-shadow(0 0 3px #b9faff) drop-shadow(0 0 9px #25bfff);
    opacity: var(--arrival-glow, 0);
    transform-origin: left center;
    transform: translateY(-50%) rotate(var(--arrival-angle, 0deg)) translateX(var(--arrival-start, 0px));
  }
  .piece.moving::before { content: ""; }
  .piece .face { transform: none; }
  .replaying .face, .preplay .face {
    background: radial-gradient(circle at 32% 24%, #aaa 40%, #858585);
  }
  .preplay .face, .replaying .piece:not(.overflow, .clearing) .face,
  .replaying .die:not(.clearing) .face {
    box-shadow: inset 0 0 0 1px #666, inset 0 0 10px #0002;
  }
  .piece.overflow .face {
    background: radial-gradient(circle at 32% 24%, #ffc2d9, #f078a6);
  }
  .clearing .face { background: rgb(226, 255, 13); }
  .inverted .clearing .face { background: rgb(29, 0, 242); }
  .result {
    pointer-events: none;
    position: fixed; left: calc((100vw - var(--field-size)) / 2 + max(16px, env(safe-area-inset-left)));
    top: calc((var(--board-height) - var(--field-size)) / 2 + max(16px, env(safe-area-inset-top))); color: #fff;
    font: 600 1.3rem "Orbitron", system-ui, sans-serif;
  }
  .combo, .countdown {
    position: fixed; margin: 0;
    color: rgb(255, 0, 102); text-shadow: 0 1px 5px #000, 0 0 12px #000;
    font: italic 800 clamp(1.5rem, 6vmin, 3rem) "Orbitron", system-ui, sans-serif;
    pointer-events: none;
  }
  .combo {
    left: calc((100vw - var(--field-size)) / 2 + max(16px, env(safe-area-inset-left)));
    bottom: calc((var(--board-height) - var(--field-size)) / 2 + max(16px, env(safe-area-inset-bottom)));
  }
  .countdown {
    top: calc(var(--board-height) / 2); left: 50%; transform: translate(-50%, -50%);
    font-size: clamp(3rem, 12vmin, 6rem);
    /* Keep italic glyph overhangs inside the text-clipped background. */
    padding: 0.1em 0.25em;
    color: #FFFF00;
    -webkit-text-stroke: 0;
    text-shadow: 2px 2px 0 #000, -2px -2px 0 #000,
                 2px -2px 0 #000, -2px 2px 0 #000;
  }
  .countdown.ready {
    animation: ready-in 1s ease-out 0.3s backwards,
               ready-fade 1s cubic-bezier(0.55, 0, 1, 0.45) 0.3s both;
  }
  @keyframes ready-in {
    from { transform: translate(-50%, -50%) scale(8); }
    to { transform: translate(-50%, -50%) scale(1); }
  }
  @keyframes ready-fade {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  .start-hint {
    position: fixed; bottom: calc((var(--board-height) - var(--field-size)) / 2 + max(16px, env(safe-area-inset-bottom)));
    right: calc((100vw - var(--field-size)) / 2 + max(16px, env(safe-area-inset-right))); margin: 0;
    color: #fff; font: 600 1rem "Orbitron", system-ui, sans-serif; pointer-events: none;
    animation: hint-fade 1.8s ease-out infinite;
  }
  @keyframes hint-fade {
    0%, 20% { opacity: 1; }
    80%, 100% { opacity: 0; }
  }
</style>
</head>
<body>
<canvas aria-hidden="true"></canvas>
<main aria-label="フリックまたはドラッグで回転する3Dサイコロ">
  <div class="die" role="img" aria-label="正面の目は1"></div>
</main>
<img class="start-logo" src="logo.png" alt="Korokoro" width="2172" height="724">
<p class="start-credit" lang="en">© 2026 michi-303</p>
<div class="incoming" aria-hidden="true"></div>
<p class="combo" role="status"></p>
<p class="start-hint" lang="en">Tap or Press Any Key</p>
<p class="countdown" role="status" lang="en" hidden></p>
<div class="result" hidden>
  <p role="status" lang="en">Game Over</p>
</div>
<script>
  const stage = document.querySelector('main');
  const die = document.querySelector('.die');
  const faces = [
    [1, 'rotateY(0deg)',   [5],                   [0, 0, 1]],
    [2, 'rotateX(90deg)',  [1, 9],                [0, -1, 0]],
    [3, 'rotateY(-90deg)', [1, 5, 9],             [-1, 0, 0]],
    [4, 'rotateY(90deg)',  [1, 3, 7, 9],          [1, 0, 0]],
    [5, 'rotateX(-90deg)', [1, 3, 5, 7, 9],       [0, 1, 0]],
    [6, 'rotateY(180deg)', [1, 3, 4, 6, 7, 9],    [0, 0, -1]],
  ];
  let six;

  function makeFace(number, cells) {
    const face = document.createElement('div');
    face.className = number === 1 ? 'face one' : 'face';
    for (const cell of cells) {
      const pip = document.createElement('span');
      pip.className = 'pip';
      pip.style.gridArea = [Math.ceil(cell / 3), (cell - 1) % 3 + 1].join(' / ');
      face.append(pip);
    }
    return face;
  }
  for (const [number, side, cells] of faces) {
    const face = makeFace(number, cells);
    face.style.setProperty('--side', side);
    die.append(face);
    if (number === 6) six = face;
  }

  const canvas = document.querySelector('canvas');
  const ctx = canvas.getContext('2d');
  const starColors = ['#a6d7ff', '#8cf5dc', '#fff0a3', '#ffba8d', '#ffa6d5', '#cbb6ff'];
  const stars = Array.from({ length: 280 }, (_, i) => ({
    x: (i % 20 + 0.15 + Math.random() * 0.7) / 20,
    y: (Math.floor(i / 20) + 0.15 + Math.random() * 0.7) / 14,
    depth: (i * 37) % 280 < 196 ? 0 : (i * 37) % 280 < 252 ? 1 : 2,
    opacity: 0.3 + Math.random() * 0.6,
    color: starColors[Math.floor(Math.random() * starColors.length)],
  }));
  const travel = [72, 204, 426];
  const constellations = [
    // オリオン座。肩、三つ星、足。
    [[-0.42,-0.47],[0.37,-0.55],[-0.18,0.05],[0,0],[0.17,-0.06],[-0.35,0.56],[0.48,0.43]],
    // 北斗七星。柄の先からひしゃくの外周へ。
    [[-0.78,-0.35],[-0.53,-0.24],[-0.29,-0.07],[-0.05,0.06],[0.13,0.40],[0.55,0.29],[0.60,-0.16]],
    // カシオペア座。W字を作る5つの星。
    [[-0.64,-0.24],[-0.39,0.22],[-0.09,-0.17],[0.24,0.16],[0.57,-0.38]],
    // さそり座。頭からアンタレスを経て、尾の先が折り返す。
    [[0.57,-0.56],[0.66,-0.34],[0.62,-0.12],[0.36,-0.21],[0.23,-0.12],
     [0.09,0.05],[-0.03,0.36],[-0.22,0.54],[-0.46,0.56],[-0.62,0.39],[-0.59,0.16],[-0.48,0.07]],
    // はくちょう座。デネブからアルビレオまでの軸と左右の翼。
    [[-0.12,-0.62],[0,-0.16],[0.15,0.31],[0.25,0.67],
     [-0.35,-0.03],[-0.66,0.14],[0.31,-0.30],[0.62,-0.43]],
    // しし座。ししの大鎌と、胴体を作る三角形。
    [[0.45,-0.57],[0.63,-0.41],[0.55,-0.20],[0.33,-0.09],[0.26,0.24],[0.32,0.49],
     [-0.38,0.25],[-0.69,0.47],[-0.23,-0.10]],
    // おうし座。ヒアデスのV字と二本の角。
    [[-0.52,-0.61],[-0.63,-0.12],[-0.13,0.03],[0.11,0.26],[0.30,0.36],
     [0.13,0.04],[0.08,-0.16],[0.70,-0.39],[0.60,-0.46],[0.69,-0.52]],
    // ふたご座。カストルとポルックスから並行に伸びる二人の姿。
    [[-0.24,-0.66],[0.21,-0.57],[-0.36,-0.32],[0.13,-0.22],
     [-0.61,-0.11],[0.50,-0.06],[-0.41,0.12],[0.05,0.18],
     [-0.58,0.58],[-0.24,0.54],[-0.05,0.63],[0.28,0.53]],
  ];
  let constellation = null;
  let constellationAt = performance.now() + 16000;
  let constellationIndex = 0;
  let previousSky = null;
  let width, height;
  let offset = [0, 0, 0, stars];
  let warp = null;
  let warpDistance = 0;
  let motion = null;
  const trailDuration = 500;
  const trail = [];
  let trailFrame = null;
  const wrap = (value, size) => ((value % size) + size) % size;

  function radialPosition(star, distance) {
    const x = star.x - 0.5;
    const y = star.y - 0.5;
    const radius = Math.max(Math.abs(x), Math.abs(y)) * 2 || 1;
    if (playState === 'waiting') {
      const edgeDistance = Math.hypot(x * width, y * height) / radius;
      const speed = [4, 10, 20][star.depth];
      const next = wrap(radius + distance * 24 * speed / edgeDistance, 1);
      return [x * next / radius, y * next / radius, next];
    }
    // 半径ではなく面積に比例する値を循環させ、中央への密集を防ぐ。
    const next = Math.sqrt(wrap(radius * radius + distance * (0.4 + star.depth * 0.19), 1));
    return [x * next / radius, y * next / radius, next];
  }

  function starPosition(index, [x, y, distance, field]) {
    const star = field[index];
    const [rx, ry] = radialPosition(star, distance);
    return [(rx + 0.5) * width + x * travel[star.depth],
            (ry + 0.5) * height + y * travel[star.depth]];
  }

  function paintStars(state) {
    for (const [index, star] of stars.entries()) {
      const depth = star.depth;
      const [x, y] = starPosition(index, state);
      const size = 2 * (1 + depth * 0.35);
      ctx.globalAlpha = star.opacity;
      ctx.fillStyle = star.color;
      ctx.fillRect(wrap(x, width), wrap(y, height),
                   size, size);
    }
  }

  function paintTrail(from, to, opacity) {
    if (from[3] !== to[3]) return;
    ctx.strokeStyle = '#c7dfff';
    ctx.lineCap = 'round';
    for (let depth = 0; depth < travel.length; depth++) {
      ctx.globalAlpha = opacity * (0.35 + depth * 0.14);
      ctx.lineWidth = 0.65 + depth * 0.45;
      ctx.beginPath();
      for (const star of to[3]) {
        if (star.depth !== depth) continue;
        const [rx, ry, radius] = radialPosition(star, to[2]);
        const [px, py, previousRadius] = radialPosition(star, from[2]);
        if (radius < previousRadius) continue;
        const dx = (rx - px) * width + (to[0] - from[0]) * travel[depth];
        const dy = (ry - py) * height + (to[1] - from[1]) * travel[depth];
        if (dx === 0 && dy === 0) continue;
        const x = wrap((rx + 0.5) * width + to[0] * travel[depth], width);
        const y = wrap((ry + 0.5) * height + to[1] * travel[depth], height);
        // 画面の端をまたぐ尾も、反対側に続けて描く。
        for (let shiftX = Math.ceil((Math.min(0, dx) - x) / width);
             shiftX <= Math.floor((width + Math.max(0, dx) - x) / width); shiftX++) {
          for (let shiftY = Math.ceil((Math.min(0, dy) - y) / height);
               shiftY <= Math.floor((height + Math.max(0, dy) - y) / height); shiftY++) {
            const headX = x + shiftX * width;
            const headY = y + shiftY * height;
            ctx.moveTo(headX - dx, headY - dy);
            ctx.lineTo(headX, headY);
          }
        }
      }
      ctx.stroke();
    }
  }

  function drawStars(now) {
    while (trail.length && now - trail[0].time >= trailDuration) trail.shift();
    ctx.clearRect(0, 0, width, height);
    trail.forEach((point, index) => {
      const next = trail[index + 1]?.offset ?? offset;
      paintTrail(point.offset, next, (1 - (now - point.time) / trailDuration) ** 2);
    });
    paintStars(offset);
    paintConstellation(now);
  }

  function paintConstellation(now) {
    if (!constellation && now >= constellationAt && !gameOver) {
      constellation = {
        points: constellations[constellationIndex],
        x: (Math.random() < 0.5 ? -1 : 1) * 0.28,
        y: (Math.random() < 0.5 ? -1 : 1) * 0.26,
        scale: 1,
        start: now,
      };
      constellationIndex = (constellationIndex + 1) % constellations.length;
      constellationAt = now + (7000 + Math.random() * 2000) * 5;
    }
    const sky = previousSky;
    previousSky = offset.slice();
    if (!constellation) return;
    const age = now - constellation.start;
    if (sky?.[3] === offset[3]) {
      const zoom = Math.exp(offset[2] - sky[2]);
      constellation.scale *= zoom;
      constellation.x = constellation.x * zoom + (offset[0] - sky[0]) * travel[0] / width;
      constellation.y = constellation.y * zoom + (offset[1] - sky[1]) * travel[0] / height;
    }
    const unit = Math.min(width, height) * 0.15 * constellation.scale;
    const radius = 2.2 * Math.min(constellation.scale, 1.8);
    const points = constellation.points.map(([x, y]) => [
      (0.5 + constellation.x) * width + x * unit,
      (0.5 + constellation.y) * height + y * unit,
    ]);
    if (points.every(([x, y]) =>
      x + radius < 0 || x - radius > width || y + radius < 0 || y - radius > height)) {
      constellation = null;
      return;
    }
    ctx.globalAlpha = Math.min(age / 650, 1);
    ctx.fillStyle = '#fff2c4';
    for (const [x, y] of points) {
      ctx.fillRect(x - radius, y - radius, radius * 2, radius * 2);
    }
  }

  let sampledAt = 0;
  let driftAt = null;
  let gameStartedAt = null;
  function updateStars(now) {
    trailFrame = null;
    const elapsed = driftAt === null ? 0 : Math.min(now - driftAt, 50);
    driftAt = now;
    const previousDistance = offset[2];
    const warping = warp !== null;
    if (warp) {
      const progress = Math.max(0, Math.min((now - warp.start) / warp.duration, 1));
      warpDistance = warp.origin + 2.2 * progress * progress * (3 - 2 * progress);
      if (progress === 1) {
        warp = null;
        document.documentElement.classList.remove('inverted');
      }
    }
    if (now - sampledAt >= 16 && (motion !== null || previousDistance !== warpDistance)) {
      trail.push({ offset: offset.slice(), time: now });
      sampledAt = now;
    }
    offset[2] = warpDistance;
    if (gameOver && !warping) {
      offset[0] -= elapsed / 20000;
    } else if (!warping && motion === null && gesture === null) {
      if (offset[0] !== 0 || offset[1] !== 0) rebaseStars();
      const speed = playState === 'playing' && gameStartedAt !== null
        ? 1 + Math.max(0, now - gameStartedAt) / 25000
        : 1;
      warpDistance += elapsed / 24000 * speed;
      offset[2] = warpDistance;
    }
    drawStars(now);
    if (gameOver) playReplay(now);
    else if (dropHistory.length && now - recordedAt >= 33) recordBoard(now);
    requestStars();
  }

  function requestStars() {
    if (trailFrame === null) trailFrame = requestAnimationFrame(updateStars);
  }

  function resize() {
    width = stage.clientWidth;
    height = stage.clientHeight;
    const shortSide = Math.min(width, height);
    const perspective = parseFloat(getComputedStyle(stage).perspective);
    // 正面の遠近補正を逆算し、短辺に5.5個分の幅を確保する。
    const front = Math.max(0, shortSide / 5.5 - 1);
    const size = front / (1 + front / (2 * perspective));
    die.style.setProperty('--size', size + 'px');
    const ratio = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(width * ratio);
    canvas.height = Math.round(height * ratio);
    canvas.style.width = width + 'px';
    canvas.style.height = height + 'px';
    ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
    drawStars(performance.now());
  }

  let rows = [[1, 0, 0], [0, 1, 0], [0, 0, 1]];
  function matrix([[a, b, c], [d, e, f], [g, h, i]]) {
    return 'matrix3d(' + [a,d,g,0,b,e,h,0,c,f,i,0,0,0,0,1].join(',') + ')';
  }

  function rotate(dx, dy) {
    const horizontal = Math.abs(dx) >= Math.abs(dy);
    const direction = Math.sign(horizontal ? dx : dy);
    const [x, y, z] = rows;
    const scale = (row, sign) => row.map(value => value * sign);
    // 左から画面座標系の90度回転を掛け、停止時の行列を整数で保持する。
    const next = horizontal
      ? [scale(z, direction), y, scale(x, -direction)]
      : [x, scale(z, direction), scale(y, -direction)];
    // 6が正面に来る回転では、まだ見えていないうちに目の列を縦にそろえる。
    if (next[2][2] === -1) {
      const twist = next[0][1] === 0 ? 0 : 90;
      six.style.setProperty('--side', 'rotateY(180deg) rotateZ(' + twist + 'deg)');
    }
    const start = performance.now();
    const origin = offset.slice();
    const panStars = warp === null;
    motion = requestAnimationFrame(function frame(now) {
      const progress = Math.max(0, Math.min((now - start) / 300, 1));
      const eased = progress * progress * (3 - 2 * progress);
      const angle = (horizontal ? direction : -direction) * 90 * eased;
      const axis = horizontal ? 'Y' : 'X';
      if (panStars) {
        offset[0] = origin[0] - (horizontal ? direction * eased : 0);
        offset[1] = origin[1] - (horizontal ? 0 : direction * eased);
      }

      if (progress < 1) {
        die.style.transform = 'rotate' + axis + '(' + angle + 'deg) ' + matrix(rows);
        motion = requestAnimationFrame(frame);
        return;
      }
      rows = next;
      die.style.transform = matrix(rows);
      const [number] = faces.find(([, , , normal]) =>
        normal.reduce((sum, component, index) => sum + component * rows[2][index], 0) === 1);
      die.setAttribute('aria-label', '正面の目は' + number);
      motion = null;
      centerNumber = number;
      matchPieces();
      flushPendingRotation();
    });
    requestStars();
  }

  const incomingLayer = document.querySelector('.incoming');
  const result = document.querySelector('.result');
  let retryReady = false;
  const startHint = document.querySelector('.start-hint');
  const startLogo = document.querySelector('.start-logo');
  const startCredit = document.querySelector('.start-credit');
  const countdown = document.querySelector('.countdown');
  let playState = 'waiting';
  const comboLabel = document.querySelector('.combo');
  let comboTimer = null;
  const directions = [[0, -1], [-1, 0], [0, 1], [1, 0]];
  const stacks = directions.map(() => []);
  let centerNumber = 1;
  let nextDirection = 0;
  const stickingDuration = 600;
  let arrivalDuration = 475;
  let incoming = null;
  let arrivalFrame = null;
  let spawnTimer = null;
  let gameOver = false;
  let overflowPiece = null;
  const dropHistory = [];
  const replayHold = 5000;
  let recordedAt = 0;
  let replay = null;
  const initialClearPause = 750;
  const minimumClearPause = 15;
  let clearPause = initialClearPause;
  let clearing = false;
  let pendingRotation = null;

  function requestRotation(dx, dy) {
    if (gameOver || playState !== 'playing') return;
    if (clearing || motion !== null) {
      if (pendingRotation === null) pendingRotation = [dx, dy];
      return;
    }
    rotate(dx, dy);
  }

  function flushPendingRotation() {
    if (pendingRotation === null || gameOver || playState !== 'playing' || clearing || motion !== null) return;
    const direction = pendingRotation;
    pendingRotation = null;
    rotate(...direction);
  }

  function recordBoard(now) {
    const pieces = stacks.flat();
    if (incoming) pieces.push(incoming);
    if (overflowPiece) pieces.push(overflowPiece);
    dropHistory[dropHistory.length - 1].push({
      time: now,
      rotation: die.style.transform,
      centerClearing: die.classList.contains('clearing'),
      sixSide: six.style.getPropertyValue('--side'),
      combo: comboLabel.textContent,
      pieces: pieces.map(piece => ({
        piece,
        units: piece.units,
        tail: piece.tail,
        overflow: piece === overflowPiece,
        clearing: piece.element.classList.contains('clearing'),
      })),
    });
    recordedAt = now;
  }

  function playReplay(now) {
    const { frames, start } = replay;
    const first = frames[0];
    const last = frames[frames.length - 1];
    const elapsed = Math.max(0, now - start) % (replayHold + last.time - first.time);
    let frame = last;
    if (elapsed >= replayHold) {
      const time = first.time + elapsed - replayHold;
      let index = frames.length - 1;
      while (frames[index].time > time) index--;
      frame = frames[index];
    }
    if (frame === replay.shown) return;
    const size = pieceSize();
    for (const { piece, units, tail, overflow, clearing } of frame.pieces) {
      piece.element.classList.toggle('overflow', overflow);
      piece.element.classList.toggle('clearing', clearing);
      const [x] = directions[piece.direction];
      const edge = (x ? width : height) / 2;
      const distance = overflow ? Math.min(units * size, edge - size * 0.3) : units * size;
      positionPiece(piece, distance, size, tail);
    }
    incomingLayer.replaceChildren(...frame.pieces.map(({ piece }) => piece.element));
    for (const { piece, overflow } of frame.pieces) {
      if (overflow && !replay.shown?.pieces.some(previous => previous.piece === piece && previous.overflow)) {
        blinkOverflow(piece);
      }
    }
    die.style.transform = frame.rotation;
    die.classList.toggle('clearing', frame.centerClearing);
    six.style.setProperty('--side', frame.sixSide);
    comboLabel.textContent = frame.combo;
    replay.shown = frame;
  }

  function blinkOverflow(piece) {
    for (const animation of piece.element.getAnimations()) animation.cancel();
    piece.element.animate([
      { opacity: 1, easing: 'steps(1, end)' },
      { opacity: 0, offset: 0.5, easing: 'steps(1, end)' },
      { opacity: 1 },
    ], { duration: 500, iterations: 3 });
  }

  function pieceSize() {
    const size = parseFloat(getComputedStyle(die).width);
    const perspective = parseFloat(getComputedStyle(stage).perspective);
    return size * perspective / (perspective - size / 2);
  }

  function positionPiece(piece, distance, size, tail = 0) {
    piece.units = distance / size;
    piece.tail = tail;
    piece.element.classList.toggle('moving', tail > 0);
    const [x, y] = directions[piece.direction];
    const glow = tail ** 0.4;
    const tailLength = Math.min(210, size * 2.1) * glow;
    piece.element.style.setProperty('--arrival-length', tailLength + 'px');
    piece.element.style.setProperty('--arrival-start', size * 0.45 + 'px');
    piece.element.style.setProperty('--arrival-angle', Math.atan2(y, x) + 'rad');
    piece.element.style.setProperty('--arrival-glow', glow);
    piece.element.style.width = size + 'px';
    piece.element.style.height = size + 'px';
    piece.element.style.transform =
      'translate(-50%, -50%) translate(' + x * distance + 'px, ' + y * distance + 'px)';
  }

  function layoutStacks() {
    const size = pieceSize();
    for (const stack of stacks) {
      stack.forEach((piece, index) => positionPiece(piece, size * (index + 1), size));
    }
    if (overflowPiece) {
      const [x] = directions[overflowPiece.direction];
      const edge = (x ? width : height) / 2;
      const distance = size * (stacks[overflowPiece.direction].length + 1);
      // 目を読める位置まで内側に寄せ、外側の縁は画面からはみ出させる。
      positionPiece(overflowPiece, Math.min(distance, edge - size * 0.3), size);
    }
  }

  function rebaseStars() {
    // 現在の見た目を保ったまま、画面中央を原点に戻す。
    const field = stars.map((star, index) => {
      const [x, y] = starPosition(index, offset);
      return { ...star, x: wrap(x, width) / width, y: wrap(y, height) / height };
    });
    offset = [0, 0, 0, field];
    warpDistance = 0;
  }

  function matchPieces() {
    const matches = stacks.map(stack => {
      const firstDifferent = stack.findIndex(piece => piece.number !== centerNumber);
      return stack.slice(0, firstDifferent === -1 ? stack.length : firstDifferent);
    });
    const matched = matches.flat();
    if (!matched.length) return;
    const combo = matched.length + 1;
    const fullClear = matches.every(line => line.length > 0);
    const highlighted = fullClear ? stacks.flat() : matched;
    if (fullClear && incoming) highlighted.push(incoming);
    const started = performance.now();
    clearing = true;
    if (arrivalFrame !== null) {
      cancelAnimationFrame(arrivalFrame);
      arrivalFrame = null;
    }
    die.classList.add('clearing');
    for (const piece of highlighted) piece.element.classList.add('clearing');
    if (combo >= 3) {
      clearTimeout(comboTimer);
      comboLabel.textContent = 'NICE ' + combo + ' combo!';
      comboTimer = setTimeout(() => { comboLabel.textContent = ''; }, 1500);
    }
    startWarp(combo, started, fullClear);
    recordBoard(started);
    setTimeout(() => {
      die.classList.remove('clearing');
      stacks.forEach((stack, index) => {
        for (const piece of stack.splice(0, matches[index].length)) piece.element.remove();
      });
      finishClear(fullClear);
      compactStacks(started);
    }, clearPause);
    clearPause = Math.max(minimumClearPause, clearPause - initialClearPause * 0.05);
  }

  function compactStacks(pausedAt) {
    const moves = stacks.flatMap(stack => stack.map((piece, index) =>
      ({ piece, from: piece.units, to: index + 1 })).filter(move => move.from !== move.to));
    const start = performance.now();
    recordBoard(start);
    function resume(now) {
      clearing = false;
      if (incoming) {
        incoming.start += now - pausedAt;
        arrivalFrame = requestAnimationFrame(advanceArrival);
      } else if (spawnTimer === null) {
        spawnTimer = setTimeout(spawnPiece, 0);
      }
      flushPendingRotation();
    }
    if (!moves.length) {
      resume(start);
      return;
    }
    requestAnimationFrame(function slide(now) {
      const progress = Math.max(0, Math.min((now - start) / 90, 1));
      const size = pieceSize();
      for (const { piece, from, to } of moves) {
        positionPiece(piece, (from + (to - from) * progress) * size, size);
      }
      if (progress < 1) requestAnimationFrame(slide);
      else resume(now);
    });
  }

  function startWarp(combo, started, fullClear) {
    rebaseStars();
    const duration = 440 * (combo >= 4 ? 3 : combo === 3 ? 2 : 1) * (fullClear ? 2 : 1);
    warp = { start: started, origin: 0, duration };
    document.documentElement.classList.toggle('inverted', combo >= 5);
    requestStars();
  }

  function finishClear(fullClear) {
    if (fullClear) {
      for (const stack of stacks) stack.length = 0;
      incomingLayer.replaceChildren();
      overflowPiece = null;
      if (incoming !== null) {
        cancelAnimationFrame(arrivalFrame);
        arrivalFrame = null;
        incoming = null;
        clearTimeout(spawnTimer);
        spawnTimer = setTimeout(spawnPiece, stickingDuration);
      }
    }
  }

  function advanceArrival(now) {
    const size = pieceSize();
    const stack = stacks[incoming.direction];
    const halfScreen = (directions[incoming.direction][0] ? width : height) / 2;
    const distance = size * (stack.length + 1);
    if (distance + size / 2 > halfScreen) {
      overflowPiece = incoming;
      overflowPiece.element.classList.add('overflow');
      blinkOverflow(overflowPiece);
      incoming = null;
      arrivalFrame = null;
      layoutStacks();
      recordBoard(now);
      replay = { frames: dropHistory.flat(), start: now, shown: null };
      if (motion !== null) cancelAnimationFrame(motion);
      motion = null;
      clearTimeout(comboTimer);
      gameOver = true;
      pendingRotation = null;
      document.documentElement.classList.add('replaying');
      result.hidden = false;
      setTimeout(() => {
        retryReady = true;
        startHint.hidden = false;
      }, 3000);
      requestStars();
      return;
    }
    const progress = Math.max(0, Math.min((now - incoming.start) / incoming.duration, 1));
    const remaining = (1 - progress) ** 2;
    positionPiece(incoming, distance + (halfScreen + size / 2 - distance) * remaining, size, 1 - progress);
    if (progress < 1) {
      arrivalFrame = requestAnimationFrame(advanceArrival);
      return;
    }
    positionPiece(incoming, distance, size);
    stack.push(incoming);
    incoming = null;
    arrivalFrame = null;
    if (motion === null) matchPieces();
    spawnTimer = setTimeout(spawnPiece, stickingDuration);
  }

  function spawnPiece() {
    spawnTimer = null;
    if (clearing) return;
    dropHistory.push([]);
    if (dropHistory.length > 8) dropHistory.shift();
    recordBoard(performance.now());
    const candidates = faces.filter(([number]) => number !== centerNumber);
    const [number, , cells] = candidates[Math.floor(Math.random() * candidates.length)];
    const element = document.createElement('div');
    element.className = 'piece';
    element.append(makeFace(number, cells));
    incomingLayer.append(element);
    incoming = { element, number, direction: nextDirection, start: performance.now(), duration: arrivalDuration };
    arrivalDuration /= 1.05;
    nextDirection = (nextDirection + 1) % directions.length;
    advanceArrival(incoming.start);
  }

  let gesture = null;
  function startCountdown() {
    if (playState === 'waiting') rebaseStars();
    // Keep 1 facing forward while choosing one of its four surrounding layouts.
    const [cos, sin] = [[1, 0], [0, 1], [-1, 0], [0, -1]][Math.floor(Math.random() * 4)];
    rows = [[cos, -sin, 0], [sin, cos, 0], [0, 0, 1]];
    die.style.transform = matrix(rows);
    playState = 'countdown';
    gameStartedAt = null;
    startLogo.hidden = true;
    startCredit.hidden = true;
    gesture = null;
    document.documentElement.classList.add('preplay');
    startHint.hidden = true;
    countdown.hidden = false;
    countdown.classList.add('ready');
    countdown.textContent = 'Ready';
    const rotationDuration = 2400;
    const readyDuration = rotationDuration + 800;
    const goDuration = 500;
    const startingRotation = matrix(rows);
    // Reveal the side faces and return to the exact gameplay orientation during Ready.
    die.animate([
      { transform: 'rotateY(0deg) ' + startingRotation, offset: 0, easing: 'ease-in-out' },
      { transform: 'rotateY(360deg) ' + startingRotation,
        offset: rotationDuration / (readyDuration + goDuration) },
      { transform: 'rotateY(360deg) ' + startingRotation, offset: 1 },
    ], { duration: readyDuration + goDuration });
    setTimeout(() => {
      countdown.classList.remove('ready');
      countdown.textContent = 'GO!';
      setTimeout(() => {
        countdown.hidden = true;
        countdown.textContent = '';
        playState = 'playing';
        gameStartedAt = performance.now();
        document.documentElement.classList.remove('preplay');
        spawnPiece();
      }, goDuration);
    }, readyDuration);
  }

  function activateStart() {
    if (gameOver && retryReady) retryGame();
    else if (playState === 'waiting') startCountdown();
  }

  const arrowDirections = new Map([
    ['ArrowUp', [0, -1]],
    ['ArrowDown', [0, 1]],
    ['ArrowLeft', [-1, 0]],
    ['ArrowRight', [1, 0]],
  ]);
  window.addEventListener('keydown', event => {
    const direction = arrowDirections.get(event.key);
    if (event.altKey || event.ctrlKey || event.metaKey || event.isComposing) return;
    if (gameOver || playState !== 'playing') {
      if (['Alt', 'Control', 'Meta', 'Shift', 'Tab'].includes(event.key)) return;
      event.preventDefault();
      if (!event.repeat) activateStart();
      return;
    }
    if (!direction) return;
    event.preventDefault();
    if (!event.repeat && gesture === null) requestRotation(...direction);
  });
  stage.addEventListener('pointerdown', event => {
    if (gesture || !event.isPrimary || event.button !== 0) return;
    const starting = playState === 'waiting' || (gameOver && retryReady);
    if (!starting && (playState !== 'playing' || gameOver)) return;
    gesture = { id: event.pointerId, x: event.clientX, y: event.clientY, starting };
    stage.setPointerCapture(event.pointerId);
  });
  stage.addEventListener('pointerup', event => {
    if (gesture?.id !== event.pointerId) return;
    const dx = event.clientX - gesture.x;
    const dy = event.clientY - gesture.y;
    const starting = gesture.starting;
    gesture = null;
    const distance = Math.max(Math.abs(dx), Math.abs(dy));
    if (starting) {
      if (distance < 24) activateStart();
    } else if (!gameOver && distance >= 24) {
      requestRotation(dx, dy);
    }
  });
  for (const type of ['pointercancel', 'lostpointercapture']) {
    stage.addEventListener(type, event => {
      if (gesture?.id === event.pointerId) gesture = null;
    });
  }
  for (const type of ['contextmenu', 'dragstart', 'selectstart']) {
    stage.addEventListener(type, event => event.preventDefault());
  }
  window.addEventListener('wheel', event => event.preventDefault(), { passive: false });
  function resizeBoard() {
    if (width === stage.clientWidth && height === stage.clientHeight) return;
    resize();
    if (replay) replay.shown = null;
    else layoutStacks();
  }
  window.addEventListener('resize', resizeBoard);
  new ResizeObserver(resizeBoard).observe(stage);
  function retryGame() {
    retryReady = false;
    clearTimeout(spawnTimer);
    clearTimeout(comboTimer);
    comboLabel.textContent = '';
    for (const frame of [arrivalFrame, motion, trailFrame]) {
      if (frame !== null) cancelAnimationFrame(frame);
    }
    arrivalFrame = motion = trailFrame = null;
    incoming = gesture = warp = null;
    pendingRotation = null;
    document.documentElement.classList.remove('inverted', 'replaying');
    overflowPiece = null;
    replay = null;
    dropHistory.length = 0;
    clearPause = initialClearPause;
    die.classList.remove('clearing');
    driftAt = null;
    warpDistance = sampledAt = nextDirection = 0;
    arrivalDuration = 475;
    offset = [0, 0, 0, stars];
    constellation = previousSky = null;
    constellationAt = performance.now() + 16000;
    constellationIndex = 0;
    trail.length = 0;
    for (const stack of stacks) stack.length = 0;
    incomingLayer.replaceChildren();
    rows = [[1, 0, 0], [0, 1, 0], [0, 0, 1]];
    die.style.transform = matrix(rows);
    centerNumber = 1;
    die.setAttribute('aria-label', '正面の目は1');
    gameOver = false;
    result.hidden = true;
    drawStars(performance.now());
    requestStars();
    startCountdown();
  }
  resize();
  requestStars();
</script>
</body>
</html>
